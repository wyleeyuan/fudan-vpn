name: build

# 打 tag（v0.5.0）自动出 macOS 安装包和命令行版并挂到 Release；也可以在 Actions 页面手动跑。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    name: macOS 原生版
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          check-latest: true
          cache-dependency-path: engine/go.sum

      # build.sh 会把 Swift 和引擎各编两份再 lipo 成通用二进制
      - name: 编译并打包 App
        run: ./build.sh

      - name: 生成 DMG
        run: SKIP_BUILD=1 ./Tools/make_dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/*.dmg
          if-no-files-found: error

  cli:
    name: 命令行版（服务器/路由器）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          check-latest: true
          cache-dependency-path: engine/go.sum

      - name: 读取版本
        id: v
        run: |
          V=$(grep -A1 CFBundleShortVersionString Resources/Info.plist | tail -1 | sed 's/[^0-9.]//g')
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: 交叉编译各平台
        run: |
          V="${{ steps.v.outputs.version }}"
          OUT="$GITHUB_WORKSPACE/build/cli"
          mkdir -p "$OUT"
          for t in linux/amd64 linux/arm64 linux/arm linux/mipsle darwin/arm64 darwin/amd64 windows/amd64; do
            goos=${t%/*}
            goarch=${t#*/}
            ext=""
            [ "$goos" = windows ] && ext=".exe"
            printf '  %-18s' "$goos/$goarch"
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch \
              go build -C "$GITHUB_WORKSPACE/engine" -trimpath \
              -ldflags "-s -w -X main.zjuConnectVersion=$V" \
              -o "$OUT/fudan-connect-$goos-$goarch$ext" .
            printf '%s\n' "$(du -h "$OUT/fudan-connect-$goos-$goarch$ext" | cut -f1)"
          done

      - name: 组装
        run: |
          V="${{ steps.v.outputs.version }}"
          cd build/cli
          cp "$GITHUB_WORKSPACE/engine/router/default_rules.conf" rules.conf
          cat > README.txt <<'TXT'
          复旦 VPN 命令行版 —— fudan-connect

          用法与 zju-connect 一致，把名字换掉即可：
            ./fudan-connect -server vpn.fudan.edu.cn -port 443 \
              -protocol atrust -auth-type auth/httpsOauth2 \
              -login-domain id.fudan.edu.cn -oauth2-code <授权码> \
              -socks-bind 127.0.0.1:1080 \
              -router-bind 127.0.0.1:1082 -router-rules rules.conf

          授权码怎么拿：浏览器打开 https://vpn.fudan.edu.cn ，扫码登录后
          地址栏那条 https://vpn.fudan.edu.cn/passport/v1/auth/httpsOauth2?code=...
          里 code= 后面就是。

          -router-bind 是分流口：按 rules.conf 里的规则，复旦的域名和校内网段
          进隧道，其余直连。不需要分流就用 -socks-bind。
          -tun-mode 需要 root 权限，Windows 还要把 wintun.dll 放在同目录。

          ./fudan-connect --help 看全部参数。

          本程序基于 zju-connect 修改，遵循 AGPL-3.0。
          TXT
          cd ..
          tar -czf "fudan-connect-$V-cli.tar.gz" cli

      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: build/*.tar.gz
          if-no-files-found: error

  release:
    name: 发布
    needs: [macos, cli]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 列出产物
        run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            在校园网外连回校内。只把复旦的流量送进隧道，其余直连 —— 不影响 Clash，不影响打游戏。

            ## 下载

            | 你的设备 | 下这个 |
            |---|---|
            | Mac（Apple 芯片） | `FudanVPN-*-*.dmg` |
            | 服务器 / 树莓派 / 路由器 | `fudan-connect-*-cli.tar.gz` |

            图形界面只发 macOS。Windows / Linux 桌面版暂停发布，源码仍在 `desktop/`。

            ## 第一次打开

            **macOS**：没有付费开发者账号，没做 Apple 公证。拖进「应用程序」后，
            在图标上点右键 → 打开 → 再点「打开」，只需要一次。

            ## 怎么用

            1. 点「登录」，App 自己的窗口里打开复旦统一身份认证，手机扫码
            2. 扫完自动回到 App，不用复制粘贴
            3. 连上之后浏览器自动走分流，不用再手动配系统代理

            以后打开 App 会自动连上（复用上次的会话），只有学校服务器那边过期了才要再扫一次。

            默认只把复旦的域名和校内网段送进隧道，其余流量直连。规则在程序里可以改。

            详细说明见 [README](https://github.com/wyleeyuan/fudan-vpn#readme)。
