name: build

# 打 tag（v0.5.0）自动出 macOS 安装包并挂到 Release；也可以在 Actions 页面手动跑。
# 只发 macOS：Windows / Linux 桌面版不接管系统代理，命令行版的场景（服务器常驻、
# 配合 ssh 跳板）用 App 的 1082 分流口就能覆盖，都不再构建。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    name: macOS 原生版
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          check-latest: true
          cache-dependency-path: engine/go.sum

      # build.sh 会把 Swift 和引擎各编两份再 lipo 成通用二进制
      - name: 编译并打包 App
        run: ./build.sh

      - name: 生成 DMG
        run: SKIP_BUILD=1 ./Tools/make_dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/*.dmg
          if-no-files-found: error

  release:
    name: 发布
    needs: [macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 列出产物
        run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            在校园网外连回校内。只把复旦的流量送进隧道，其余直连 —— 不影响 Clash，不影响打游戏。

            ## 下载

            | 你的设备 | 下这个 |
            |---|---|
            | Mac（Apple 芯片） | `FudanVPN-*-*.dmg` |

            只有 macOS 版。Windows / Linux 桌面版和命令行版都不再发布了，源码仍在仓库里。

            ## 第一次打开

            **macOS**：没有付费开发者账号，没做 Apple 公证。拖进「应用程序」后，
            在图标上点右键 → 打开 → 再点「打开」，只需要一次。

            ## 怎么用

            1. 点「登录」，App 自己的窗口里打开复旦统一身份认证，手机扫码
            2. 扫完自动回到 App，不用复制粘贴
            3. 连上之后浏览器自动走分流，不用再手动配系统代理

            以后打开 App 会自动连上（复用上次的会话），只有学校服务器那边过期了才要再扫一次。

            默认只把复旦的域名和校内网段送进隧道，其余流量直连。规则在程序里可以改。

            详细说明见 [README](https://github.com/wyleeyuan/fudan-vpn#readme)。
