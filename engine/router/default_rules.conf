# 复旦 VPN 分流规则
#
# 一行一条，从上往下匹配，第一条命中的生效，都没命中就落到 MATCH。
# 所以顺序比条数重要：具体的写前面，笼统的写后面。
#
#   TUNNEL  送进复旦隧道
#   DIRECT  本机直连
#
# 支持的类型：
#   DOMAIN,域名,动作              完全相等
#   DOMAIN-SUFFIX,后缀,动作        该域及其所有子域
#   DOMAIN-KEYWORD,片段,动作       域名里含这个词
#   IP-CIDR,网段,动作[,no-resolve] 目标本身是 IP 时
#   MATCH,动作                    兜底，必须放最后
#
# 改完存盘即生效，不用重启，下一次新连接就按新规则走。
# 万一改错了（格式写错），会继续用上一版规则，错误打到日志里。

# ── 复旦 ──
# 这两个是登录和门户本身，必须直连。
# 送进隧道的话，隧道出口那一侧反而到不了它们（id 会直接返回 host unreachable），
# 表现是登录页一直转圈。
DOMAIN,id.fudan.edu.cn,DIRECT
DOMAIN,vpn.fudan.edu.cn,DIRECT

DOMAIN-SUFFIX,fudan.edu.cn,TUNNEL
DOMAIN-SUFFIX,fudan.sh.cn,TUNNEL
DOMAIN-SUFFIX,fudanpress.com,TUNNEL

# ── 常用校内服务 ──
# 都是 fudan.edu.cn 的子域，上面那条后缀规则已经覆盖。
# 单独列出来是为了以后想把某个服务单独改成 DIRECT 时，有明确的一行可以动。
# 注意 icourse 是内网域名，公网 DNS 里查不到，只能走隧道解析。
DOMAIN-SUFFIX,ehall.fudan.edu.cn,TUNNEL
DOMAIN-SUFFIX,icourse.fudan.edu.cn,TUNNEL
DOMAIN-SUFFIX,elearning.fudan.edu.cn,TUNNEL
DOMAIN-SUFFIX,library.fudan.edu.cn,TUNNEL
DOMAIN-SUFFIX,mail.fudan.edu.cn,TUNNEL

# ── 校内网段 ──
# 10.x 和 172.16-31.x 是复旦内网，服务器、实验室机器都在这里
IP-CIDR,10.0.0.0/8,TUNNEL,no-resolve
IP-CIDR,172.16.0.0/12,TUNNEL,no-resolve
# 202.120.224.0/19 是复旦分到的公网段（老校区、部分对外服务）。
# 少了这条，访问这一段地址会被判成直连，从校外根本到不了，
# 表现是「跳板配好了却卡住不动」。
IP-CIDR,202.120.224.0/19,TUNNEL,no-resolve

# ── 按学校出口 IP 授权的学术库 ──
# 这些站不连学校 VPN 打不开全文，家里宽带 IP 不在授权名单里
DOMAIN-SUFFIX,cnki.net,TUNNEL
DOMAIN-SUFFIX,cnki.com.cn,TUNNEL
DOMAIN-SUFFIX,webofscience.com,TUNNEL
DOMAIN-SUFFIX,webofknowledge.com,TUNNEL
DOMAIN-SUFFIX,clarivate.com,TUNNEL
DOMAIN-SUFFIX,ieee.org,TUNNEL
DOMAIN-SUFFIX,acm.org,TUNNEL
DOMAIN-SUFFIX,springer.com,TUNNEL
DOMAIN-SUFFIX,nature.com,TUNNEL
DOMAIN-SUFFIX,science.org,TUNNEL
DOMAIN-SUFFIX,sciencedirect.com,TUNNEL
DOMAIN-SUFFIX,elsevier.com,TUNNEL
DOMAIN-SUFFIX,wiley.com,TUNNEL
DOMAIN-SUFFIX,tandfonline.com,TUNNEL
DOMAIN-SUFFIX,jstor.org,TUNNEL
DOMAIN-SUFFIX,ebsco.com,TUNNEL
DOMAIN-SUFFIX,proquest.com,TUNNEL
DOMAIN-SUFFIX,scopus.com,TUNNEL
DOMAIN-SUFFIX,wanfangdata.com.cn,TUNNEL
DOMAIN-SUFFIX,cqvip.com,TUNNEL

# ── 其余全部直连 ──
# api.openai.com、github.com、registry.npmjs.org 都在这一侧
MATCH,DIRECT
